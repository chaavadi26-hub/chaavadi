<!DOCTYPE html>
<html lang="mr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>विभाग — चावडी न्यूज</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
<header>
    <h1 class="logo"><a href="index.html"><img src="img/chaavadi_logo.png" alt="चावडी न्यूज" width="250"></a></h1>
</header>

<nav>
    <div class="dropdown">
        <button class="dropbtn">☰ विभाग</button>
        <div class="dropdown-content">
            <a href="index.html">📰 ताज्या बातम्या</a>
            <a href="category.html?cat=krida">🏏 क्रीडा</a>
            <a href="category.html?cat=rajkaran">🏛 राजकारण</a>
            <a href="category.html?cat=arthavyavastha">💹 अर्थव्यवस्था</a>
            <a href="category.html?cat=sthanik">📍 स्थानिक</a>
            <a href="category.html?cat=arogya">🧑‍⚕️ आरोग्य</a>
            <a href="category.html?cat=aantararashtriya">🌍 आंतरराष्ट्रीय</a>
        </div>
    </div>
    <div class="date" id="currentDate"></div>
</nav>

<section class="news-section">
  <h2 class="section-title" id="categoryTitle">बातम्या</h2>
  <div class="news-grid" id="newsGrid">
    <p class="no-news">बातम्या लोड होत आहेत...</p>
  </div>
</section>

<footer>
    © 2026 Chaavadi. All Rights Reserved.<br>
    Website designed & developed by VILLTECH VISION
</footer>

<script>
    const today = new Date();
    document.getElementById("currentDate").innerHTML =
        today.toLocaleDateString('mr-IN', { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' });
</script>
<script src="js/app.js"></script>
<script>
  const params = new URLSearchParams(window.location.search);
  const cat = params.get("cat");
  document.getElementById("categoryTitle").innerText = categoryLabel(cat) || "बातम्या";
  renderNewsGrid("newsGrid", cat);
</script>
</body>
</html>
